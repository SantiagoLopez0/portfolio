<!-- @dsCard group="Actions" height=240 subtitle="Tag por defecto, accent, alt y versión sticker rotada" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:var(--font-body);font-size:0.875rem}
.row{display:grid;grid-template-columns:1fr 1fr}
.panel{background:var(--surface-base);color:var(--ink);padding:var(--space-8) var(--space-12);display:flex;flex-direction:column;gap:var(--space-4)}
.cap{font-size:0.75rem;color:var(--ink-muted)}
.tags{display:flex;gap:var(--space-2);flex-wrap:wrap}
.stickers{display:flex;gap:var(--space-4);padding:var(--space-3) 0}
.tag{display:inline-block;color:var(--white);letter-spacing:-.02em;background-color:var(--tag-bg);border-radius:1.55em;padding:.25em .65em;font-family:var(--font-display);font-size:1.2em;font-weight:400;line-height:1.15}
.accent{background-color:var(--accent);color:var(--on-accent)}
.alt{background-color:var(--accent-alt);color:var(--on-accent-alt)}
</style>
</head>
<body>
<div class="row">
<div class="panel" data-theme="dark">
<span class="cap">Dark</span>
<div class="tags"><span class="tag">Webflow</span><span class="tag">Next.js</span><span class="tag accent">Disponible</span><span class="tag alt">Astro + Sanity</span></div>
<span class="cap">Sticker (hero)</span>
<div class="stickers"><span class="tag" style="transform:rotate(-6deg)">Webflow</span><span class="tag" style="transform:rotate(5deg)">Colombia</span><span class="tag accent" style="transform:rotate(-3deg)">Disponible</span></div>
</div>
<div class="panel" data-theme="light">
<span class="cap">Light</span>
<div class="tags"><span class="tag">Webflow</span><span class="tag">Next.js</span><span class="tag accent">Disponible</span><span class="tag alt">Astro + Sanity</span></div>
<span class="cap">Sticker (hero)</span>
<div class="stickers"><span class="tag" style="transform:rotate(-6deg)">Webflow</span><span class="tag" style="transform:rotate(5deg)">Colombia</span><span class="tag accent" style="transform:rotate(-3deg)">Disponible</span></div>
</div>
</div>
</body>
</html>
