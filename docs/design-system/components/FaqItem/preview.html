<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:var(--font-body)}
.row{display:grid;grid-template-columns:1fr 1fr}
.panel{background:var(--surface-raised);color:var(--ink);padding:var(--space-8) var(--space-12)}
.list{border-top:1px solid var(--ink)}
.item{border-bottom:1px solid var(--line);padding:var(--space-6) 0}
.head{display:flex;justify-content:space-between;align-items:center;gap:var(--space-6);width:100%;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-align:left}
.head:focus-visible{outline:0.125rem solid var(--accent);outline-offset:0.25rem}
.q{font-family:var(--font-display);font-size:1.5rem;line-height:1.25;font-weight:600;letter-spacing:-.015em}
.a{margin:var(--space-4) 0 0;max-width:32.5rem;font-size:1rem;line-height:1.5rem;color:var(--ink-muted)}
</style>
</head>
<body>
<div class="row">
<div class="panel" data-theme="dark"><div class="list">
<div class="item"><button class="head" type="button" aria-expanded="true"><span class="q">[Pregunta frecuente 1]</span><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button><p class="a">[Respuesta corta. El contenido del FAQ se define más adelante.]</p></div>
<div class="item"><button class="head" type="button" aria-expanded="false"><span class="q">[Pregunta frecuente 2]</span><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
</div></div>
<div class="panel" data-theme="light"><div class="list">
<div class="item"><button class="head" type="button" aria-expanded="true"><span class="q">[Pregunta frecuente 1]</span><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button><p class="a">[Respuesta corta. El contenido del FAQ se define más adelante.]</p></div>
<div class="item"><button class="head" type="button" aria-expanded="false"><span class="q">[Pregunta frecuente 2]</span><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
</div></div>
</div>
</body>
</html>
