<!-- @dsCard group="Actions" height=230 subtitle="Relleno con flecha, outline fino con flecha y outline en negrita, todos en mayúsculas" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:var(--font-body);font-size:0.875rem}
.row{display:grid;grid-template-columns:1fr 1fr}
.panel{background:var(--surface-base);color:var(--ink);padding:var(--space-8) var(--space-12);display:flex;flex-direction:column;gap:var(--space-4)}
.cap{font-size:0.75rem;color:var(--ink-muted)}
.btns{display:flex;flex-direction:column;gap:var(--space-4);align-items:flex-start}
.btn{display:inline-flex;justify-content:center;align-items:center;column-gap:.45em;row-gap:.45em;border:1px solid var(--accent);background-color:var(--accent);color:var(--white);text-align:center;letter-spacing:-.02em;text-transform:uppercase;cursor:pointer;border-radius:8.33em;padding:0.8125rem 1.625rem;font-family:var(--font-display);font-size:1.1875rem;font-weight:700;line-height:1.15;text-decoration:none}
.btn:hover{opacity:.88}
.btn:focus-visible{outline:0.125rem solid var(--ink);outline-offset:0.1875rem}
.btn svg{flex:none}
.outline{border:1px solid var(--ink);background-color:transparent;color:var(--ink);font-size:1.125rem;font-weight:400}
.caps{border:1.5px solid var(--ink);background-color:transparent;color:var(--ink);font-size:1.125rem}
.outline:hover,.caps:hover{opacity:1;background-color:var(--ink);color:var(--surface-base)}
</style>
</head>
<body>
<div class="row">
<div class="panel" data-theme="dark">
<span class="cap">Dark</span>
<div class="btns">
<a class="btn" href="#">View my work <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
<a class="btn outline" href="#">Browse my work <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg></a>
<a class="btn caps" href="#">Let's talk</a>
</div>
</div>
<div class="panel" data-theme="light">
<span class="cap">Light</span>
<div class="btns">
<a class="btn" href="#">View my work <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
<a class="btn outline" href="#">Browse my work <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg></a>
<a class="btn caps" href="#">Let's talk</a>
</div>
</div>
</div>
</body>
</html>
